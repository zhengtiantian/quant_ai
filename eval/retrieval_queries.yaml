# R.4 — labelled query set for retrieval evaluation.
#
# Written by hand rather than generated, and grouped by the *retrieval challenge* each
# query poses rather than by topic. Grouping this way is the point: an aggregate
# recall@10 hides that sparse wins on tickers and dense wins on paraphrase, and the
# whole argument for hybrid rests on that split. A query set organised by topic could
# not show it.
#
# challenge:
#   paraphrase  — deliberately shares no distinctive term with how articles phrase it,
#                 so lexical matching should fail and only semantics can succeed
#   literal     — a ticker, product or person; a token with no useful embedding
#                 neighbourhood, where dense retrieval should struggle
#   event       — a named corporate event; both legs should do reasonably
#   thematic    — a theme spanning several companies, where the answer is not one
#                 article and no single company name appears in the query
#   temporal    — same as event but with a date window, to exercise filter symmetry
#
# `symbol` / `since` / `until` are passed to the retriever, so they define the task, not
# a hint. Leaving symbol empty means the retriever must find the companies itself.

queries:
  # ---------- paraphrase: lexical matching should fail here ----------
  - id: p01
    query: memory glut pressures chip makers
    challenge: paraphrase
    note: articles say "DRAM oversupply", "memory prices fall", rarely "glut"

  - id: p02
    query: carmaker slashes sticker prices to move inventory
    challenge: paraphrase

  - id: p03
    query: streaming service loses subscribers for the first time
    challenge: paraphrase

  - id: p04

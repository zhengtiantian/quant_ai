<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portfolio">
<meta name="theme-color" content="#0b0b0d">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Portfolio</title>
<style>
  /* The desktop widget's card (Übersicht portfolio.jsx) at phone size: same data, same colours. */
  :root { --bg: #0b0b0d; --card: #1c1c20; --line: rgba(255,255,255,0.08); --text: #f5f5f7; --muted: #94a3b8; --soft: #cbd5e1;
          --up: #34d399; --down: #fb7185; --flat: #94a3b8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%; }
  body { font-family: -apple-system, "SF Pro Text", "PingFang SC", sans-serif; font-variant-numeric: tabular-nums;
         padding: calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 16px); }
  .card { overflow: hidden; background: var(--card); border: 0.5px solid rgba(255,255,255,0.12); border-radius: 22px; padding: 16px 16px 12px; max-width: 560px; margin: 0 auto; }
  .row > * { min-width: 0; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .title { font-weight: 700; font-size: 16px; }
  .pill { font-size: 12px; border-radius: 999px; padding: 2px 10px; white-space: nowrap; border: 1px solid; }
  .muted { color: var(--muted); font-size: 12px; }
  .total { font-size: 30px; font-weight: 800; letter-spacing: -0.4px; line-height: 36px; }
  .clock { display: grid; grid-template-columns: auto auto auto; column-gap: 7px; font-size: 11.5px; line-height: 15px; text-align: right; }
  .sums { display: flex; gap: 14px; margin-top: 6px; font-size: 14px; flex-wrap: wrap; }
  .hr { height: 1px; background: var(--line); margin: 10px 0 4px; }
  .h { display: grid; grid-template-columns: 58px minmax(0, 1fr) 118px; align-items: center; padding: 7px 0; border-top: 1px solid rgba(255,255,255,0.05); }
  .h:first-child { border-top: 0; }
  .sym { font-weight: 700; font-size: 15px; }
  .tag { font-size: 11px; font-weight: 500; display: block; margin-top: 1px; }
  .pair { display: grid; grid-template-columns: minmax(0, 1fr) 10px minmax(0, 1fr); line-height: 18px; }
  .pair .r { text-align: right; } .pair .c { text-align: center; color: var(--muted); font-size: 12px; }
  .px { font-size: 15px; font-weight: 600; } .avg { font-size: 15px; color: var(--soft); } .mv { font-size: 12.5px; }
  .right { text-align: right; line-height: 18px; }
  .dchg { font-size: 15px; font-weight: 600; } .pnl { font-size: 12.5px; white-space: nowrap; }
  .ghead { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; }
  .ghead .t { font-weight: 700; font-size: 14px; } .ghead a { color: #60a5fa; font-size: 12px; text-decoration: none; }
  .gnote { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 15px; }
  .region { margin-top: 10px; } .region .name { font-weight: 700; margin-bottom: 2px; }
  .country { border-top: 1px solid rgba(255,255,255,0.05); padding: 5px 0; }
  .country .top { display: flex; gap: 8px; font-size: 12.5px; line-height: 19px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .country .cn { width: 116px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .country .ix { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; column-gap: 10px; }
  .country .chev { color: var(--muted); font-size: 11px; flex-shrink: 0; transition: transform .15s; }
  .country.open .chev { transform: rotate(180deg); }
  .exch { margin: 6px 0 2px; padding: 8px 10px; background: rgba(255,255,255,0.035); border-radius: 12px; }
  .exch .en { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
  .exch .meta { font-size: 11px; color: var(--muted); margin: 1px 0 4px; }
  .q { display: grid; grid-template-columns: minmax(0, 1fr) auto 62px; column-gap: 8px; font-size: 13px; line-height: 21px; }
  .q .qn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .q .qp { text-align: right; } .q .qc { color: var(--muted); font-size: 10.5px; margin-left: 3px; }
  .q .qd { text-align: right; font-weight: 600; }
  .q.qi .qn { font-weight: 700; } .q.first-stock { border-top: 1px solid rgba(255,255,255,0.06); margin-top: 3px; padding-top: 3px; }
  .foot { display: flex; justify-content: space-between; margin-top: 10px; }
  .msg { padding: 8px 0; }
</style>
</head>
<body>
<div class="card" id="card"><div class="title">💼 Portfolio</div><div class="muted msg">Loading…</div></div>
<script>
// Reads state (the portfolio cut down for this page, see markets/mobile.py) and re-reads it as often
// as the server asks (refresh_seconds: 5 s in trading hours; 60 s otherwise), only while the page is
// visible. The last reply is kept in localStorage and shown marked offline when quant_ai is not reachable.
const SESSION = { pre: ["Pre-market", "#f59e0b"], regular: ["Open", "#10b981"], post: ["After hours", "#a855f7"], closed: ["Closed", "#94a3b8"] };
const SESSION_TAG = { pre: "pre", regular: "open", post: "after", closed: "closed" };
const SESSION_HOURS = { pre: "04:00–09:30", regular: "09:30–16:00", post: "16:00–20:00", closed: "pre 04:00" };
const UP = "#34d399", DOWN = "#fb7185", FLAT = "#94a3b8";
const KEY = "pfMobileLast", OPEN_KEY = "pfMobileOpenCountries";
// Which countries are expanded: kept across refreshes (the card is re-rendered) and visits.
let openCountries = new Set();
try { openCountries = new Set(JSON.parse(localStorage.getItem(OPEN_KEY)) || []); } catch (e) {}
const saveOpen = () => { try { localStorage.setItem(OPEN_KEY, JSON.stringify([...openCountries])); } catch (e) {} };
let lastData = null, lastOffline = false;

// Session hours in Beijing and Dublin, from today's US-Eastern boundaries through the IANA zones
// (the same as the widget, so the weeks when Europe and the US switch clocks apart are right).
const ET = "America/New_York";
const ZONES = [["BJ", "Asia/Shanghai"], ["DUB", "Europe/Dublin"]];
const ET_BOUNDS = [[4, 0], [9, 30], [16, 0], [20, 0]];
const tzOffsetMin = (utcMs, zone) => {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: zone, hourCycle: "h23", year: "numeric", month: "2-digit",
    day: "2-digit", hour: "2-digit", minute: "2-digit" }).formatToParts(new Date(utcMs)).map((x) => [x.type, x.value]));
  return (Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute) - utcMs) / 60000;
};
const etWallToUtc = (y, m, d, hh, mm) => {
  const guess = Date.UTC(y, m - 1, d, hh, mm);
  const utc = guess - tzOffsetMin(guess, ET) * 60000;
  return guess - tzOffsetMin(utc, ET) * 60000;
};
const hm = (ms, zone) => new Intl.DateTimeFormat("en-GB", { timeZone: zone, hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(new Date(ms));
const zoneRows = (session) => {
  const now = Date.now();
  const etDate = (ms) => new Intl.DateTimeFormat("en-CA", { timeZone: ET }).format(new Date(ms)).split("-").map(Number);
  let [y, m, d] = etDate(now);
  let b = ET_BOUNDS.map(([hh, mm]) => etWallToUtc(y, m, d, hh, mm));
  if (session === "closed") {
    const weekday = (yy, mm, dd) => new Date(Date.UTC(yy, mm - 1, dd)).getUTCDay();
    let t = now;
    while (b[0] <= now || [0, 6].includes(weekday(y, m, d))) {
      t += 24 * 3600 * 1000;
      [y, m, d] = etDate(t);
      b = ET_BOUNDS.map(([hh, mm]) => etWallToUtc(y, m, d, hh, mm));
    }
  }
  const idx = { pre: 0, regular: 1, post: 2 }[session];
  return ZONES.map(([label, zone]) => [label, hm(now, zone), idx == null ? `pre ${hm(b[0], zone)}` : `${hm(b[idx], zone)}–${hm(b[idx + 1], zone)}`]);
};

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const usd = (v, dp = 2) => v == null || isNaN(v) ? "—" : (v < 0 ? "-$" : "$") + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp });
const signed = (v, dp = 2) => (v == null || isNaN(v) ? "—" : (v > 0 ? "+" : "") + usd(v, dp));
const pct = (v) => (v == null || isNaN(v) ? "" : `${v > 0 ? "+" : ""}${v.toFixed(2)}%`);
const col = (v) => (v == null || Math.abs(v) < 1e-9 ? FLAT : v > 0 ? UP : DOWN);
// Taiwan's flag drawn (as in the widget): some devices hide the emoji whatever region is set.
const TW_SUN = Array.from({ length: 24 }, (_, i) => {
  const r = i % 2 === 0 ? 3.75 : 2.05, a = (Math.PI / 12) * i - Math.PI / 2;
  return `${(7.5 + r * Math.cos(a)).toFixed(3)},${(5 + r * Math.sin(a)).toFixed(3)}`;
}).join(" ");
const flag = (c) => c.code === "TW"
  ? `<svg viewBox="0 0 30 20" height="11" style="vertical-align:-1px;border-radius:1px"><rect width="30" height="20" fill="#FE0000"/><rect width="15" height="10" fill="#000095"/><polygon points="${TW_SUN}" fill="#fff"/><circle cx="7.5" cy="5" r="2.05" fill="#000095"/><circle cx="7.5" cy="5" r="1.75" fill="#fff"/></svg>`
  : esc(c.flag || "");
const SHORT = { "United Kingdom": "UK" };          // the country column is narrow on a phone
const num = (v) => (v == null || isNaN(v) ? "—" : v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const span = (text, color, extra = "") => `<span style="color:${color};${extra}">${text}</span>`;

function render(d, offline) {
  lastData = d; lastOffline = offline;
  const card = document.getElementById("card");
  if (!d) {
    card.innerHTML = `<div class="title">💼 Portfolio</div><div class="muted msg">Cannot reach quant_ai. The Mac must be awake with quant_ai running (launchd com.quant.ai), and this phone on Tailscale.</div>`;
    return;
  }
  const t = d.totals || {};
  const [sLabel, sColor] = SESSION[d.session] || [d.session, FLAT];
  const fetched = Math.max(0, ...(d.holdings || []).map((h) => (h.quote && h.quote.fetched_at) || 0));
  const age = fetched ? Math.max(0, Math.round((offline ? Date.now() / 1000 : d.server_time) - fetched)) : null;
  const ageText = age == null ? "" : age < 60 ? `${age}s ago` : age < 3600 ? `${Math.round(age / 60)} min ago` : `${Math.round(age / 3600)} h ago`;
  const clock = [["ET", d.us_time, SESSION_HOURS[d.session] || ""], ...zoneRows(d.session)]
    .map(([l, now, range]) => `<span class="muted" style="font-size:11.5px">${l}</span><span>${esc(now)}</span><span>${esc(range)}</span>`).join("");
  const ratio = t.cost ? span(`${(t.market_value / t.cost * 100).toFixed(2)}%`, t.market_value >= t.cost ? "#4ade80" : "#f87171", "margin-left:6px;font-weight:700") : "";

  const holdings = (d.holdings || []).map((h) => {
    const q = h.quote || {};
    const tag = q.session ? `<span class="tag" style="color:${(SESSION[q.session] || [])[1] || FLAT}">${SESSION_TAG[q.session] || esc(q.session)}</span>` : "";
    return `<div class="h">
      <div class="sym">${esc(h.symbol)}${tag}</div>
      <div class="pair">
        <span class="r px">${usd(q.price)}</span><span class="c">/</span><span class="avg">${usd(h.avg_cost)}</span>
        <span class="r mv">${usd(h.market_value, 0)}</span><span class="c">/</span><span class="muted">${usd(h.cost, 0)}</span>
      </div>
      <div class="right">
        <div class="dchg" style="color:${col(h.day_change_pct)}">${pct(h.day_change_pct) || "—"}</div>
        <div class="pnl" style="color:${col(h.unrealized)}">${signed(h.unrealized, 0)} ${pct(h.unrealized_pct)}</div>
      </div></div>`;
  }).join("") || `<div class="muted msg">No holdings yet</div>`;

  // Global markets: one line per country (its indices); tap it for its exchanges, each with its
  // status, local time and hours, its indices and its stocks.
  const g = d.global || {};
  const statusPill = (open) => `<span class="pill" style="font-size:11px;padding:0 8px;color:${open ? UP : FLAT};border-color:${open ? UP : FLAT}55">${open ? "Open" : "Closed"}</span>`;
  const quoteRow = (q, cls) => `<div class="q ${cls}"><span class="qn">${esc(q.name)}</span>` +
    `<span class="qp">${num(q.price)}<span class="qc">${esc(q.currency || "")}</span></span>` +
    `<span class="qd" style="color:${col(q.change_pct)}">${pct(q.change_pct) || "—"}</span></div>`;
  const regions = (g.regions || []).map((r) => `<div class="region"><div class="muted name">${r.name === "Asia" ? "🌏" : "🌍"} ${esc(r.name)}</div>` +
    r.countries.map((c) => {
      const isOpen = openCountries.has(c.code);
      const ix = c.exchanges.flatMap((e) => e.indices).map((i) =>
        `<span style="white-space:nowrap"><span style="color:#cbd5e1">${esc(i.name)}</span> ${span(pct(i.change_pct) || "—", col(i.change_pct), "font-weight:600")}</span>`).join("");
      const detail = isOpen ? c.exchanges.map((e) => `<div class="exch">
          <div class="en"><span>${esc(e.name)}</span>${statusPill(e.open)}</div>
          <div class="meta">local ${esc(e.local_time || "—")} · hours ${esc(e.hours || "—")}</div>
          ${(e.indices || []).map((q) => quoteRow(q, "qi")).join("")}
          ${(e.stocks || []).map((q, n) => quoteRow(q, n === 0 && (e.indices || []).length ? "first-stock" : "")).join("")}
        </div>`).join("") : "";
      return `<div class="country${isOpen ? " open" : ""}"><div class="top" data-country="${esc(c.code)}">` +
        `<span class="cn">${c.open ? span("● ", UP) : ""}${flag(c)} ${esc(SHORT[c.name] || c.name)}</span><span class="ix">${ix}</span><span class="chev">▾</span></div>${detail}</div>`;
    }).join("") + `</div>`).join("");
  const allOpen = (g.regions || []).every((r) => r.countries.every((c) => openCountries.has(c.code)));
  const globalHead = (g.regions || []).length ? `<div class="ghead"><span class="t">🌐 Global markets</span>` +
    `<a href="#" data-toggle-all="${allOpen ? "close" : "open"}">${allOpen ? "Collapse all" : "Expand all"}</a></div>` +
    `<div class="gnote">Open exchanges refresh every ${g.refresh_seconds || 60} s; closed ones keep their last close · CNBC, Korean stocks from Naver; may be delayed</div>` : "";

  card.innerHTML = `
    <div class="row" style="margin-bottom:6px" onclick="load(true)">
      <span class="title">💼 Portfolio</span>
      <span class="pill" style="color:${sColor};border-color:${sColor}55">US ${esc(sLabel)}</span>
    </div>
    <div class="row" style="align-items:flex-start">
      <div>
        <div class="total">${usd(t.market_value)}</div>
        <div class="muted">cost ${usd(t.cost)}${ratio}</div>
      </div>
      <div class="clock" style="color:${sColor}">${clock}</div>
    </div>
    <div class="sums">
      <span>Today <b style="color:${col(t.day_pnl)}">${signed(t.day_pnl)} ${pct(t.day_pnl_pct)}</b></span>
      <span>P&amp;L <b style="color:${col(t.unrealized)}">${signed(t.unrealized, 0)} ${pct(t.unrealized_pct)}</b></span>
    </div>
    <div class="hr"></div>
    ${holdings}
    <div class="hr" style="margin-bottom:0"></div>
    ${globalHead}
    ${regions}
    <div class="muted foot">
      <span>${offline ? span("offline · ", DOWN, "font-weight:700") : ""}${ageText ? `Quotes ${ageText}` : ""}</span>
      <span>${d.refresh_seconds ? `Every ${d.refresh_seconds}s` : "Closed, no quote refresh"}</span>
    </div>`;
}

let timer = null;
async function load() {
  clearTimeout(timer);
  let wait = 30;
  try {
    const r = await fetch("state", { cache: "no-store" });
    const d = await r.json();
    if (d.status !== "success") throw new Error(d.message || "error");
    render(d, false);
    try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
    wait = Math.max(5, d.refresh_seconds || 60);
  } catch (e) {
    let last = null;
    try { last = JSON.parse(localStorage.getItem(KEY)); } catch (e2) {}
    render(last, true);
  }
  if (!document.hidden) timer = setTimeout(load, wait * 1000);
}
// Taps on a country (or "Expand all") re-render from the last reply at once, without a fetch.
document.getElementById("card").addEventListener("click", (ev) => {
  const top = ev.target.closest("[data-country]"), all = ev.target.closest("[data-toggle-all]");
  if (!top && !all) return;
  ev.preventDefault();
  if (top) {
    const code = top.dataset.country;
    openCountries.has(code) ? openCountries.delete(code) : openCountries.add(code);
  } else {
    openCountries = new Set(all.dataset.toggleAll === "open"
      ? ((lastData && lastData.global && lastData.global.regions) || []).flatMap((r) => r.countries.map((c) => c.code)) : []);
  }
  saveOpen();
  if (lastData) render(lastData, lastOffline);
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); else clearTimeout(timer); });
load();
</script>
</body>
</html>
